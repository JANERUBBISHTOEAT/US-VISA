<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Visa Checker</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 10px;
        width: 300px;
      }
      #status {
        font-weight: bold;
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <h3>美签预约监控</h3>

    <label for="locationNumb">地点编号：</label>
    <input type="text" id="locationNumb" placeholder="如 95 = Vancouver" />

    <div id="status">状态：未启动</div>
    <button id="toggleBtn">开始监控</button>

    <div id="info">
      <p>预约 ID: <span id="scheduleDisplay">-</span></p>
      <p>地点 ID: <span id="locationDisplay">-</span></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
