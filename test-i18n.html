<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多语言测试</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
      }
      .language-select {
        margin-bottom: 20px;
      }
      button {
        padding: 8px 16px;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <h1>美签扩展多语言测试</h1>

    <div class="language-select">
      <label>选择语言 / Select Language:</label>
      <select id="langSelect" title="选择语言">
        <option value="zh-Hans">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </div>

    <div class="test-section">
      <h3>UI 元素测试</h3>
      <p data-i18n="ui.title">🇺🇸 美签预约监控</p>
      <button data-i18n="ui.start_monitoring">开始监控</button>
      <button data-i18n="ui.stop_monitoring">停止监控</button>
      <button data-i18n="ui.settings">设置</button>
    </div>

    <div class="test-section">
      <h3>表单元素测试</h3>
      <label data-i18n="form.appointment_center">预约中心</label><br />
      <label data-i18n="form.check_interval">检查间隔</label><br />
      <label data-i18n="form.auto_submit">自动提交预约 (高级功能)</label>
    </div>

    <div class="test-section">
      <h3>状态消息测试</h3>
      <p>状态: <span data-i18n="status_messages.monitoring">监控中...</span></p>
      <p>页面: <span data-i18n="page_types.appointment">预约页面</span></p>
    </div>

    <div class="test-section">
      <h3>通知消息测试</h3>
      <p data-i18n="notifications.monitoring_started">监控已启动</p>
      <p data-i18n="notifications.found_earlier_appointment">发现更早预约!</p>
    </div>

    <script src="src/js/i18n.js"></script>
    <script>
      let i18n;

      async function initTest() {
        i18n = new I18n();
        await i18n.init();
        updateAllTexts();

        // 语言切换事件
        document
          .getElementById("langSelect")
          .addEventListener("change", async (e) => {
            const selectedLang = e.target.value;
            if (await i18n.setLanguage(selectedLang)) {
              updateAllTexts();
              console.log("语言已切换到:", selectedLang);
            }
          });
      }

      function updateAllTexts() {
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          const key = element.getAttribute("data-i18n");
          element.textContent = i18n.t(key);
        });
      }

      // 页面加载完成后初始化
      document.addEventListener("DOMContentLoaded", initTest);
    </script>
  </body>
</html>
